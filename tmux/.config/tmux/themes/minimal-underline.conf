# ==========================================
# Theme: Minimal Underline (Transparent Status Bar)
# ==========================================

# Status bar base styling
set -g status-position bottom
set -g status-style "bg=default,fg=#9399b2"
set-option -g status-justify centre
set -g status-left-length 50
set -g status-right-length 50

# Left & Right status
set -g status-left '#[fg=#89b4fa,bold] #S #{?#{==:#{pane_pipe},1},#[fg=#585b70]│ #[fg=#f38ba8,bold]⏺ REC ,}'
set -g status-right '#[fg=#a6e3a1]󰥔 %I:%M %p #[fg=#585b70]│ #[fg=#89b4fa]󰃭 %d-%b-%y '

# Window status (Clean Underline)
setw -g window-status-separator "   "
setw -g window-status-style "fg=#6c7086,bg=default"
setw -g window-status-format '#[fg=#6c7086]#I:#W'
setw -g window-status-current-style "fg=#cba6f7,bg=default,bold,underscore"
setw -g window-status-current-format '#[fg=#cba6f7,bold,underscore]#I:#W#[default]#{?window_zoomed_flag, #[fg=#fab387]󰁌,}'

# Window activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=#fab387,bg=default,bold"

# Pane borders
set -g pane-border-status off
set -g pane-border-style "fg=#1e1e2e"
set -g pane-active-border-style "fg=#89b4fa,bold"
set -g pane-border-lines heavy

# Popups and modes
set -g display-panes-time 2000
set -g display-panes-colour "#585b70"
set -g display-panes-active-colour "#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4,bold"
set -g message-command-style "bg=#313244,fg=#f9e2af,bold"
setw -g mode-style "bg=#45475a,fg=#cba6f7,bold"
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 12
