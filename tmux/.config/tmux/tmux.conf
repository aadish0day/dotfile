# Unbind default prefix and set new one
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Update environment variables (Fixes clipboard issues in Wayland/X11)
set -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK SSH_AUTH_SOCK"

# Status bar configuration
set -g status-left-length 50
set -g status-right-length 50
set-option -sg escape-time 10
set-option -g focus-events on

# History and display settings
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 1

# Window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane splitting with better paths
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Session management
set -g detach-on-destroy off

# Terminal settings for 24-bit true color and undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",xterm-kitty*:RGB:clipboard:cstyle:focus"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors

# Tmux 3.8+ popup, menu & window styling (preserves Kitty transparency)
set -s dark-theme-dark-grey default
set -gw fill-character " "
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "bg=default,fg=#585b70"
set -gw menu-style "bg=default,fg=default"
set -gw menu-selected-style "bg=#45475a,fg=#cba6f7,bold"
set -gw menu-border-style "bg=default,fg=#585b70"
set -gw pane-scrollbars-style "bg=default,fg=#585b70"
set -gw display-panes-border-style "bg=default,fg=#585b70"
set -gw tree-mode-border-style "bg=default,fg=#585b70"

# ===== THEME / STATUS BAR CONFIGURATION =====
# Select active theme by uncommenting one line below:
source-file ~/.config/tmux/themes/minimal-dots.conf
# source-file ~/.config/tmux/themes/minimal-underline.conf
# source-file ~/.config/tmux/themes/classic-dark.conf
# source-file ~/.config/tmux/themes/catppuccin-pills.conf

# ===== KEY BINDINGS =====

# Config reload with better message
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Vi mode settings
setw -g mode-keys vi
bind -Tcopy-mode-vi v send-keys -X begin-selection
bind -Tcopy-mode-vi V send-keys -X select-line
bind -Tcopy-mode-vi C-v send-keys -X rectangle-toggle
bind -Tcopy-mode-vi Escape send-keys -X cancel

# Robust clipboard binding: tries wl-copy, then xclip
bind -Tcopy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null"

bind -Tcopy-mode-vi u send -X halfpage-up
bind -Tcopy-mode-vi d send -X halfpage-down

# Clear screen binding (since C-l is used for pane navigation)
bind C-l send-keys 'C-l'

# Window and pane navigation (no -r flag to prevent "stickiness")
bind C-a last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Window management
bind q kill-window
bind x kill-pane
unbind-key -n C-z
unbind i
bind i swap-window -t +1
bind u swap-window -t -1

# Session management
bind-key N new-session
bind-key -r f run-shell "tmux neww tmux-sessionizer"
bind-key -r o run-shell "tmux neww tmux-fzf-switcher"
bind-key -r e run-shell "tmux neww cybersec-tmux"

# Pane synchronization toggle
bind S set-window-option synchronize-panes\; display-message "Sync #{?pane_synchronized,ON,OFF}"

# Pane resizing with arrow keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5



# allow-passthrough is intentionally left off (default). When enabled, apps can
# forward DCS/XTGETTCAP queries (e.g. for the Ms/OSC 52 capability) to the outer
# terminal; tmux does not understand the responses and re-injects them into the
# active pane as literal text (e.g. "1+r4d73=5c455d..."). Fixes garbled output
# when switching panes under kitty.

# ===== PLUGINS =====
set -g @logging-path "$HOME/logs/tmux"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'

# Bootstrap TPM if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

set -g mouse off

